[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-endgame-rl"
version = "0.1.0"
description = "Reinforcement learning experiments for simple chess endgames"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-chess>=1.10.0",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
train = [
  "torch>=2.2.0",
  "stable-baselines3>=2.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
